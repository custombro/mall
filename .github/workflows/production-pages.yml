name: Production Pages Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Deploy target ref"
        required: true
        default: "main"

concurrency:
  group: production-pages
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: custombro-mall-order-v1
      NODE_VERSION: 20.19.0
    steps:
      - name: Verify existing production credentials
        shell: bash
        run: |
          deployment_missing=()
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then deployment_missing+=("CLOUDFLARE_API_TOKEN"); fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then deployment_missing+=("CLOUDFLARE_ACCOUNT_ID"); fi
          if (( ${#deployment_missing[@]} )); then
            printf '::error::Missing existing production environment secrets: %s\n' "${deployment_missing[*]}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check stock preservation and customer consultation handoff
        run: node --test tests/acrylic-stock-thickness.test.mjs tests/display-studio-handoff.test.mjs

      - name: Build static export
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit

      - name: Deploy production to Cloudflare Pages
        run: npx wrangler pages deploy out --project-name=${PROJECT_NAME} --branch=main
